# Configuración de AndroidX obligatoria para Compose y librerías modernas
android.useAndroidX=true
android.enableJetifier=true

# Optimización de Gradle
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
kotlin.code.style=official

# Permitir descarga de JDK necesario (Gradle requiere JDK 21 para toolchains modernos)
org.gradle.java.installations.auto-download=true

# Silenciar advertencia de compileSdk 36 en AGP 8.7.3
android.suppressUnsupportedCompileSdk=36

