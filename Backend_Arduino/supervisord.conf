; =============================================================================
; AGRILION Backend — Supervisord Configuration
; =============================================================================
; Ejecuta los 3 scripts de backend en paralelo dentro del mismo contenedor.
; Si uno falla, supervisord lo reinicia automáticamente.
; =============================================================================

[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

[program:ttn_mqtt]
command=python TTN_MQTT.py
directory=/app
autostart=true
autorestart=true
stderr_logfile=/var/log/ttn_mqtt.err.log
stdout_logfile=/var/log/ttn_mqtt.out.log
startsecs=5

[program:mqtt_influxdb_firebase]
command=python MQTT_INFLUXDB_FIREBASE.py
directory=/app
autostart=true
autorestart=true
stderr_logfile=/var/log/mqtt_influxdb_firebase.err.log
stdout_logfile=/var/log/mqtt_influxdb_firebase.out.log
startsecs=5

[program:mqtt_to_ai_bridge]
command=python mqtt_to_ai_bridge.py
directory=/app
autostart=true
autorestart=true
stderr_logfile=/var/log/mqtt_to_ai_bridge.err.log
stdout_logfile=/var/log/mqtt_to_ai_bridge.out.log
startsecs=5
